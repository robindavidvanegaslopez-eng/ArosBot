
name: Build ArosBot APK

on:
  push:
    paths:
      - 'ArosBot-visual-detection.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          unzip -o ArosBot-visual-detection.zip -d proyecto

      - name: Compilar APK
        run: |
          GRADLEW=$(find proyecto -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew en el ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ArosBot-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
